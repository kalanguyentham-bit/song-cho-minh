<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sống Cho Mình Mà Không Cảm Thấy Có Lỗi™ — Đăng ký</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDE5D0; --surface: #FFFFFF; --text: #3D2A1A; --text-muted: #6B5340;
    --accent: #C77539; --accent-deep: #8F5226; --border: rgba(61,42,26,0.14);
    --font-h: 'Lora', Georgia, serif; --font-b: 'Roboto', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-b); background: var(--bg); color: var(--text); line-height: 1.6; padding: 40px 20px; }
  .container { max-width: 480px; margin: 0 auto; background: var(--surface); padding: 36px 32px; border-radius: 14px; box-shadow: 0 8px 32px rgba(54,42,34,0.08); }
  h1 { font-family: var(--font-h); font-size: 24px; margin-bottom: 8px; }
  .lead { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; background: var(--bg); color: var(--text); }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .cta { width: 100%; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%); color: #fff; padding: 15px; font-size: 16px; font-weight: 700; font-family: var(--font-h); border: none; border-radius: 8px; cursor: pointer; margin-top: 22px; }
  .cta:hover { opacity: 0.92; }
  .cta:disabled { background: #999; cursor: not-allowed; }
  .error { color: #A8503A; font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Đăng ký Workshop</h1>
  <p class="lead">Điền thông tin để giữ chỗ — nếu chọn Vé VIP, bạn sẽ được chuyển đến trang thanh toán.</p>

  <form id="orderForm">
    <label>Họ tên *</label>
    <input type="text" name="name" required>

    <label>Số điện thoại (có Zalo) *</label>
    <input type="tel" name="phone" required pattern="[0-9]{10,11}">

    <label>Email *</label>
    <input type="email" name="email" required>

    <label>Chọn hạng vé *</label>
    <select name="goal" required>
      <option value="">-- Chọn hạng vé --</option>
      <option value="Vé Tiêu Chuẩn (Miễn phí)">Vé Tiêu Chuẩn (Miễn phí)</option>
      <option value="Vé VIP (99K)">Vé VIP — 99.000đ (Phiên Thực Hành Chuyên Sâu + Bản Thiết Kế V1)</option>
    </select>

    <button type="submit" class="cta" id="submitBtn">Xác Nhận Đăng Ký →</button>
    <p class="error" id="error"></p>
  </form>
</div>

<script>
  const GAS_URL = '__GAS_URL__';

  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Đang xử lý...';

    const form = new FormData(e.target);
    const data = {
      name: form.get('name'),
      phone: form.get('phone'),
      email: form.get('email'),
      goal: form.get('goal'),
      bump1: false,
      bump2: false,
      totalAmount: 99000
    };

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'createOrder', data: data })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'Order creation failed');

      sessionStorage.setItem('order', JSON.stringify({
        orderId: json.orderId,
        ckContent: json.ckContent,
        totalAmount: json.totalAmount,
        name: data.name,
        email: data.email,
        phone: data.phone,
        goal: data.goal
      }));

      // Vé miễn phí không cần thanh toán — sepay-funnel cần bổ sung nhánh rẽ tại đây
      window.location.href = '/checkout';
    } catch (err) {
      errEl.textContent = 'Lỗi: ' + err.message + '. Vui lòng thử lại.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Xác Nhận Đăng Ký →';
    }
  });
</script>
</body>
</html>
