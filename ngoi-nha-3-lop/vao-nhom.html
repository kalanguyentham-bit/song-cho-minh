<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ngôi Nhà 3 Lớp: Vào nhóm Zalo</title>
<style>
  :root { --bg: #FDE5D0; --surface: #FFFFFF; --text: #3D2A1A; --text-muted: #6B5340; --accent: #C77539; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 40px 16px; text-align: center; line-height: 1.6; }
  .box { max-width: 420px; margin: 0 auto; background: var(--surface); border-radius: 14px; padding: 28px 22px; }
  a.btn { display: inline-block; margin-top: 16px; background: var(--accent); color: #fff; font-weight: 700; padding: 12px 24px; border-radius: 100px; text-decoration: none; }
  p { color: var(--text-muted); }
</style>
</head>
<body>
<div class="box">
  <h1 style="font-size: 20px; margin-bottom: 8px;" id="tieuDe">Đang mở nhóm Zalo...</h1>
  <p id="moTa">Nếu Zalo không tự mở sau vài giây, bạn bấm nút dưới đây.</p>
  <!-- href ghi sẵn nhóm lớp; nhóm VIP thì script hỏi máy chủ link nhóm (chỉ trả khi đơn đã thanh toán) -->
  <a class="btn" id="linkNhom" href="https://zalo.me/g/afweoiaxvoywcsm4nsxh">Mở Nhóm Zalo</a>
</div>

<script src="/ngoi-nha-3-lop/config.js"></script>
<script>
  // Trang trung gian cho nút "Vào nhóm Zalo" (trang cảm ơn, email cũ).
  // ?n=lop (nhóm lớp, vé miễn phí) hoặc ?n=vip (nhóm VIP); ?d=mã đơn.
  // Gửi lượt bấm về Apps Script (ghi cột daBamLinkNhom; vé miễn phí tự tích daVaoNhomZaloFree) rồi mở Zalo.
  // Nhóm lớp: link trong config.js. Nhóm VIP: link KHÔNG có trong trang, máy chủ (getStatus) chỉ trả về khi đơn đã thanh toán.
  (function () {
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyVg-mCaMDv_4HNpKLCrXv6oY4Yfb2K5cwc-9FXFyehFOnJ9xR2kZ8SZ2mqxjyZ6HJB/exec';
    var cfg = window.APP_CONFIG || {};
    var q = new URLSearchParams(location.search);
    var nhom = q.get('n') === 'vip' ? 'vip' : 'lop';
    var orderId = (q.get('d') || '').slice(0, 40);
    var nut = document.getElementById('linkNhom');

    if (orderId) {
      var body = JSON.stringify({ action: 'daBamNhom', orderId: orderId, nhom: nhom });
      var daGui = false;
      try { daGui = navigator.sendBeacon && navigator.sendBeacon(GAS_URL, new Blob([body], { type: 'text/plain' })); } catch (e) {}
      if (!daGui) { try { fetch(GAS_URL, { method: 'POST', body: body, mode: 'no-cors', keepalive: true }); } catch (e) {} }
    }

    if (nhom === 'lop') {
      nut.href = cfg.LINK_NHOM_LOP;
      setTimeout(function () { location.replace(cfg.LINK_NHOM_LOP); }, 150);
      return;
    }

    nut.style.display = 'none';
    document.getElementById('moTa').textContent = 'Thắm đang kiểm tra đơn VIP của bạn, có thể mất vài giây.';
    function khongCoLink() {
      document.getElementById('tieuDe').textContent = 'Chưa mở được nhóm VIP';
      document.getElementById('moTa').textContent = 'Link nhóm Zalo VIP có trong email xác nhận thanh toán của bạn. Không thấy email? Nhắn Fanpage kèm mã đơn để Thắm hỗ trợ.';
    }
    if (!orderId) return khongCoLink();
    fetch(GAS_URL + '?action=getStatus&orderId=' + encodeURIComponent(orderId))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || j.status !== 'PAID' || !j.linkNhomVip) return khongCoLink();
        nut.href = j.linkNhomVip;
        nut.style.display = '';
        document.getElementById('moTa').textContent = 'Nếu Zalo không tự mở sau vài giây, bạn bấm nút dưới đây.';
        location.replace(j.linkNhomVip);
      })
      .catch(khongCoLink);
  })();
</script>
</body>
</html>
